# =====================================================================
# Promtail - thu gom log của các container và đẩy về Loki.
# Dùng Docker service discovery: hỏi Docker danh sách container rồi đọc log của từng container,
# container mới thêm vào cũng được thu gom tự động.
# =====================================================================
server:
  http_listen_port: 9080      # trang /metrics của chính Promtail (Prometheus thu thập)
  grpc_listen_port: 0
  log_level: warn

# Ghi nhớ đã đọc tới đâu trong log của từng container -> khởi động lại không gửi trùng log cũ.
positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        # Chỉ lấy container thuộc project Docker Compose của hệ thống Quiz
        filters:
          - name: label
            values: ["com.docker.compose.project=dtc245200152"]

    # Relabeling: đổi thông tin kỹ thuật của Docker thành NHÃN dễ dùng khi truy vấn.
    # Chỉ giữ ít nhãn, giá trị ít thay đổi (low cardinality) -> chỉ mục Loki nhỏ, truy vấn nhanh.
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']      # "/quiz-web" -> container="quiz-web"
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service                                  # tên service trong compose: web, nginx, db...
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream                                   # stdout / stderr
      - target_label: system
        replacement: quiz-de35

    pipeline_stages:
      # Log của Nginx: stdout là access log (JSON), stderr là error log (văn bản).
      # Gắn nhãn log_type để tách hai loại khi truy vấn.
      # Lưu ý: script khởi động của image nginx cũng in ra stdout ("/docker-entrypoint.sh: ...")
      # -> chỉ dòng bắt đầu bằng "{" mới là access log; các dòng còn lại gắn log_type="system".
      - match:
          selector: '{service="nginx", stream="stdout"} |~ "^\\{"'
          stages:
            - static_labels:
                log_type: access
      - match:
          selector: '{service="nginx", stream="stdout"} !~ "^\\{"'
          stages:
            - static_labels:
                log_type: system
      - match:
          selector: '{service="nginx", stream="stderr"}'
          stages:
            - static_labels:
                log_type: error
      # Log ứng dụng web là JSON có trường "level" -> lấy làm nhãn để lọc nhanh info/warn/error.
      - match:
          selector: '{service="web"}'
          stages:
            - json:
                expressions:
                  level: level
            - labels:
                level:
