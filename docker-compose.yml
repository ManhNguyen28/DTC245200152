# Hệ thống Quiz / Thi trắc nghiệm - Đề 35
# Nguyễn Đức Mạnh - DTC245200152
#
# Luồng truy cập:  Người dùng --https:443--> nginx --> web (Node.js) --> db (MySQL)
#                                             └--> /phpmyadmin/ --> phpmyadmin --> db
#                                             └--> /grafana/, /prometheus/ --> giám sát
# Chỉ nginx mở cổng ra ngoài. Ba mạng tách biệt:
#   frontend  : nginx <-> web, phpmyadmin, grafana, prometheus, nginx-exporter
#   backend   : web, phpmyadmin, mysqld-exporter <-> db   (nginx KHÔNG nằm trong mạng này -> không chạm được CSDL)
#   monitoring: prometheus <-> các exporter, web (/metrics); grafana -> prometheus, loki; promtail -> loki

# Xoay vòng log của Docker cho MỌI container: tối đa 3 file x 10 MB.
# Mặc định file log lớn không giới hạn -> có thể làm đầy ổ đĩa máy chủ.
# (Log vẫn được lưu lâu dài, có tổ chức trong Loki.)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- Reverse proxy: cổng vào duy nhất ----------
  nginx:
    image: nginx:alpine
    container_name: quiz-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"     # HTTP  -> chuyển hướng sang HTTPS
      - "443:443"   # HTTPS
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro          # cấu hình site (thay toàn bộ cấu hình mặc định)
      - ./nginx/snippets:/etc/nginx/snippets:ro      # đoạn cấu hình dùng chung
      - ./nginx/certs:/etc/nginx/certs:ro            # chứng chỉ SSL (tạo bằng nginx/gen-cert.sh)
      - ./nginx/auth:/etc/nginx/auth:ro              # mật khẩu Basic Auth cho /prometheus/ (nginx/gen-htpasswd.sh)
    depends_on:
      - web
      - phpmyadmin
      - grafana
      - prometheus
    networks:
      - frontend

  # ---------- Ứng dụng web Quiz (Node.js) ----------
  web:
    build: ./app
    image: quiz-web:1.0
    container_name: quiz-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      TRUST_PROXY: "1"         # tin header X-Forwarded-* từ 1 lớp proxy (nginx) -> lấy đúng IP và giao thức https
      COOKIE_SECURE: "true"    # cookie phiên chỉ gửi qua HTTPS
    expose:
      - "3000"                 # chỉ mở trong mạng Docker, KHÔNG publish ra máy chủ
    depends_on:
      db:
        condition: service_healthy   # chỉ khởi động khi MySQL đã sẵn sàng
    networks:
      - frontend
      - backend
      - monitoring                   # để Prometheus đọc /metrics

  # ---------- Cơ sở dữ liệu MySQL ----------
  db:
    image: mysql:8.0
    container_name: quiz-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}       # dùng bởi 02-monitoring-user.sh
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql                                   # dữ liệu bền vững, không mất khi xóa container
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro # tạo bảng + dữ liệu mẫu ở lần chạy đầu
      - ./db/02-monitoring-user.sh:/docker-entrypoint-initdb.d/02-monitoring-user.sh:ro  # user 'exporter' quyền tối thiểu
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  # ---------- Công cụ quản lý CSDL (truy cập qua https://<IP>/phpmyadmin/) ----------
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: quiz-phpmyadmin
    restart: unless-stopped
    logging: *default-logging
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${PUBLIC_HOST}/phpmyadmin/   # địa chỉ công khai khi chạy sau reverse proxy
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # =================== GIÁM SÁT (Prometheus + Grafana) ===================

  # ---------- Prometheus: thu thập & lưu số liệu, đánh giá cảnh báo ----------
  prometheus:
    image: prom/prometheus:latest
    container_name: quiz-prometheus
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d          # giữ số liệu 7 ngày
      - --storage.tsdb.retention.size=300MB       # và không quá 300 MB (máy chủ ít dung lượng đĩa)
      - --web.external-url=https://${PUBLIC_HOST}/prometheus/   # chạy dưới đường dẫn /prometheus/ sau Nginx
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - frontend      # để Nginx chuyển /prometheus/ vào
      - monitoring    # để thu thập số liệu từ các exporter

  # ---------- Grafana: dashboard trực quan ----------
  grafana:
    image: grafana/grafana:latest
    container_name: quiz-grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SERVER_DOMAIN: ${PUBLIC_HOST}
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${MONITOR_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${MONITOR_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"             # không cho tự đăng ký
      GF_AUTH_ANONYMOUS_ENABLED: "false"          # bắt buộc đăng nhập
      GF_ANALYTICS_REPORTING_ENABLED: "false"     # không gửi thống kê ra ngoài
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/quiz-web.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro   # nguồn dữ liệu + nạp dashboard tự động
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro       # 3 dashboard dạng JSON
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - frontend
      - monitoring

  # ---------- Exporter: số liệu từng container Docker ----------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: quiz-cadvisor
    restart: unless-stopped
    logging: *default-logging
    privileged: true    # NGOẠI LỆ có chủ đích: cần đọc cgroup của mọi container; không mở cổng ra ngoài
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,referenced_memory,resctrl,sched,tcp,udp,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - monitoring

  # ---------- Exporter: số liệu máy chủ (CPU, RAM, ổ đĩa của VM) ----------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: quiz-node-exporter
    restart: unless-stopped
    logging: *default-logging
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - monitoring

  # ---------- Exporter: số liệu MySQL (dùng user 'exporter' quyền tối thiểu) ----------
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: quiz-mysqld-exporter
    restart: unless-stopped
    logging: *default-logging
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    expose:
      - "9104"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend       # để kết nối MySQL
      - monitoring    # để Prometheus thu thập

  # ---------- Exporter: số liệu Nginx (đọc trang stub_status nội bộ) ----------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: quiz-nginx-exporter
    restart: unless-stopped
    logging: *default-logging
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    expose:
      - "9113"
    depends_on:
      - nginx
    networks:
      - frontend      # để gọi tới nginx:8080
      - monitoring

  # =================== LOG TẬP TRUNG (Loki + Promtail) ===================

  # ---------- Loki: lưu trữ log tập trung, truy vấn bằng LogQL ----------
  loki:
    image: grafana/loki:3.7.8
    container_name: quiz-loki
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - monitoring    # chỉ Promtail (đẩy log) và Grafana (truy vấn) kết nối tới

  # ---------- Promtail: thu gom log mọi container của dự án, đẩy về Loki ----------
  promtail:
    image: grafana/promtail:3.6.8
    container_name: quiz-promtail
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # hỏi Docker danh sách container và đọc log
      - promtail_data:/var/lib/promtail                  # vị trí đã đọc (không gửi trùng khi khởi động lại)
    expose:
      - "9080"
    depends_on:
      - loki
    networks:
      - monitoring

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:

networks:
  frontend:
  backend:
  monitoring:
