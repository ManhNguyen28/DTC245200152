# Hệ thống Quiz / Thi trắc nghiệm - Đề 35
# Nguyễn Đức Mạnh - DTC245200152
# Giai đoạn 1: Web ứng dụng + MySQL + phpMyAdmin

services:
  # ---------- Cơ sở dữ liệu MySQL ----------
  db:
    image: mysql:8.4
    container_name: quiz-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql                                   # dữ liệu bền vững, không mất khi xóa container
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro # tạo bảng + dữ liệu mẫu ở lần chạy đầu
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  # ---------- Ứng dụng web Quiz (Node.js) ----------
  web:
    build: ./app
    image: quiz-web:1.0
    container_name: quiz-web
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "3000:3000"   # tạm thời mở để kiểm tra; sẽ bỏ khi đưa Nginx vào làm cổng duy nhất
    depends_on:
      db:
        condition: service_healthy   # chỉ khởi động khi MySQL đã sẵn sàng
    networks:
      - backend

  # ---------- Công cụ quản lý CSDL ----------
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: quiz-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
