# =====================================================================
# Nginx reverse proxy cho hệ thống Quiz (Đề 35 - DTC245200152)
#   :80  -> chuyển hướng sang HTTPS
#   :443 -> /            : ứng dụng web Quiz (container "web", cổng 3000)
#           /phpmyadmin/ : công cụ quản lý CSDL (container "phpmyadmin", cổng 80)
# File này được nạp bên trong khối http {} của /etc/nginx/nginx.conf.
# =====================================================================

server_tokens off;   # không hiện phiên bản Nginx trong header "Server" và trang lỗi

# Log truy cập dạng JSON (mỗi request 1 dòng) -> Loki/LogQL lọc theo trường dễ dàng.
log_format json_access escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
  '"referer":"$http_referer","user_agent":"$http_user_agent","host":"$host"}';

# Giới hạn tốc độ GỬI FORM ĐĂNG NHẬP theo IP: 20 lần/phút, cho phép dồn tối đa 10 lần.
# Chỉ áp dụng cho POST (khóa rỗng "" = không giới hạn) nên mở trang đăng nhập không bị tính.
map $request_method $login_limit_key {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $login_limit_key zone=login_limit:10m rate=20r/m;
limit_req_status 429;

# Header Connection cho WebSocket (dùng trong snippets/proxy.conf).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

# Danh sách máy chủ phía sau. "web", "phpmyadmin" là tên service trong docker-compose,
# Docker DNS tự phân giải ra IP container.
upstream quiz_web {
  server web:3000;
  keepalive 16;
}
upstream quiz_pma {
  server phpmyadmin:80;
}
upstream quiz_grafana {
  server grafana:3000;
}
upstream quiz_prometheus {
  server prometheus:9090;
}

# ---------- :8080 NỘI BỘ - số liệu của Nginx cho nginx-exporter ----------
# Cổng 8080 KHÔNG được publish trong docker-compose -> chỉ các container mới gọi được.
server {
  listen 8080;
  server_name _;
  access_log off;

  location = /stub_status {
    stub_status;              # số kết nối đang mở, tổng số request... của Nginx
    allow 127.0.0.1;
    allow 172.16.0.0/12;      # dải IP mạng nội bộ của Docker
    deny all;
  }
  location / {
    return 404;
  }
}

# ---------- HTTP :80 -> chuyển hướng vĩnh viễn (301) sang HTTPS ----------
server {
  listen 80;
  listen [::]:80;
  server_name _;
  access_log /var/log/nginx/access.log json_access;

  location = /nginx-health {          # kiểm tra Nginx còn sống (dùng cho healthcheck)
    access_log off;
    return 200 "ok\n";
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------- HTTPS :443 ----------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;
  access_log /var/log/nginx/access.log json_access;

  # Chứng chỉ tự ký (tạo bằng nginx/gen-cert.sh)
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  # Chỉ cho phép TLS 1.2 và 1.3 (TLS 1.0/1.1 đã lỗi thời, có lỗ hổng)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 2m;   # giới hạn kích thước request (nhập CSV tối đa vài trăm KB)

  gzip on;
  gzip_types text/css application/javascript application/json;

  # Content-Security-Policy cho ứng dụng Quiz: chỉ cho phép tải script/style/ảnh từ chính trang này.
  # -> nếu kẻ xấu chèn được <script> vào trang (XSS) thì trình duyệt cũng không chạy.
  set $csp_app "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

  location / {
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy $csp_app always;
    proxy_pass http://quiz_web;
  }

  # Form đăng nhập: thêm lớp giới hạn tốc độ ở Nginx (lớp ngoài) bên cạnh bộ đếm đăng nhập sai của ứng dụng.
  location = /login {
    limit_req zone=login_limit burst=10 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy $csp_app always;
    proxy_pass http://quiz_web;
  }

  # File tĩnh: cho trình duyệt lưu cache 1 giờ.
  location /static/ {
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy $csp_app always;
    expires 1h;
    proxy_pass http://quiz_web;
  }

  # phpMyAdmin: dùng script inline nên không áp CSP chặt của ứng dụng; vẫn có các security header khác.
  location /phpmyadmin/ {
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://quiz_pma/;   # dấu "/" cuối: bỏ tiền tố /phpmyadmin/ trước khi chuyển vào container
  }
  location = /phpmyadmin {
    return 301 /phpmyadmin/;
  }

  # Số liệu nội bộ của ứng dụng: chỉ Prometheus (trong mạng Docker) được đọc, chặn từ bên ngoài.
  location = /metrics {
    return 404;
  }

  # Grafana (có trang đăng nhập riêng). Grafana tự đặt các security header của nó.
  location /grafana/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://quiz_grafana;   # KHÔNG có "/" cuối: giữ nguyên tiền tố /grafana/ (Grafana chạy ở sub-path)
  }

  # Prometheus không có chức năng đăng nhập -> Nginx yêu cầu tài khoản (HTTP Basic Auth) trước khi cho vào.
  location /prometheus/ {
    auth_basic "Prometheus - DTC245200152";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;   # tạo bằng nginx/gen-htpasswd.sh
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://quiz_prometheus;
  }
}
