# Security headers: chỉ dẫn để TRÌNH DUYỆT bảo vệ người dùng.
# "always" = gắn cả vào phản hồi lỗi (4xx, 5xx), không chỉ phản hồi 200.

# HSTS: trong 1 năm, trình duyệt luôn tự dùng HTTPS với trang này (chống tấn công hạ cấp xuống HTTP).
add_header Strict-Transport-Security "max-age=31536000" always;

# Chống clickjacking: không cho trang web khác nhúng trang này vào <iframe> để lừa người dùng bấm.
add_header X-Frame-Options "SAMEORIGIN" always;

# Chống MIME sniffing: trình duyệt phải dùng đúng Content-Type, không tự "đoán" file .txt thành script.
add_header X-Content-Type-Options "nosniff" always;

# Khi bấm link sang trang khác, chỉ gửi tên miền, không gửi đường dẫn đầy đủ (có thể chứa id bài làm).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Tắt các quyền thiết bị mà ứng dụng không cần.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Cô lập cửa sổ trình duyệt với trang mở nó (chống một số tấn công qua window.opener).
add_header Cross-Origin-Opener-Policy "same-origin" always;

# X-XSS-Protection: bộ lọc XSS cũ của trình duyệt đã bị Chrome/Edge/Firefox loại bỏ và từng gây lỗ hổng,
# nên khuyến nghị hiện nay (OWASP) là tắt hẳn ("0") và dùng Content-Security-Policy thay thế.
add_header X-XSS-Protection "0" always;
