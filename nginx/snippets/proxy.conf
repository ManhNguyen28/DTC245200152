# Thông tin chuyển tiếp từ Nginx vào ứng dụng phía sau.
proxy_http_version 1.1;
# Có yêu cầu nâng cấp WebSocket (Grafana Live) -> "upgrade"; không có -> rỗng để giữ keepalive tới upstream.
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;                  # IP thật của người dùng
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;    # chuỗi IP đi qua các proxy
proxy_set_header X-Forwarded-Proto $scheme;                       # báo cho app biết người dùng đang dùng https
proxy_set_header X-Forwarded-Host  $host;

proxy_connect_timeout 5s;
proxy_read_timeout    60s;

proxy_hide_header X-Powered-By;                                   # không để lộ công nghệ phía sau
